# PostgreSQL Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donadores}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=true

# Server Configuration for Dockerfile
server.port=${PORT:8080}

# Datadog

management.endpoint.prometheus.enabled=true
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.step=${DATADOG_STEP:30s}
management.datadog.metrics.export.enabled=${DATADOG_ENABLED:false}
management.datadog.metrics.export.uri=${DATADOG_URI:https://api.datadoghq.com}

#Renders
URL_LOGISTICA=https://donatrack-api-logistica-diseno-en-beta.onrender.com
URL_INCENTIVOS=https://entrega-2-melinazingales.onrender.com
URL_DONACIONES=https://donaciones-xouj.onrender.com

\\
spring.application.name=donadores

# Histograms permit p95/p99 queries instead of relying only on averages.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
